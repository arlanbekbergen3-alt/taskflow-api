[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"conftest.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "repositories", "routers", "schemas", "services"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["core", "db", "models", "repositories", "routers", "schemas", "services", "main"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["core", "db", "models", "repositories", "routers", "schemas", "services", "main.py", "worker.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
